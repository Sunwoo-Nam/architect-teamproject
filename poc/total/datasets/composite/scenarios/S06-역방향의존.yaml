meta:
  id: S06
  name: 역방향 의존 — 인기작 mv6은 금·토 21시만 상영 (1안 약점 자극)
  conflict_level: mid
  conflict_rho: 0.0
  expected: agreement
axes:
  - {name: date, generator: date_slots, base_count: 7}
  - {name: time, generator: time_slots, base_count: 6}
